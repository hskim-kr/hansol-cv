{% assign education = site.data.data.education %}

{% if education %}
<section class="cv-section cv-education">
  <h2 class="section-title">Education</h2>

  <table class="education-table">
    <tbody>
      {% for ed in education %}
      <tr>
        <td class="course">{{ ed.course }}</td>
        <td>
          <div>{{ ed.department }}</div>
          {% if ed.advisor %}
          <div class="sub-info">(Advisor: {{ ed.advisor }})</div>
          {% endif %}
        </td>
        <td>
          {{ ed.time }}
          {% if ed.note %}
          <div class="sub-info">({{ ed.note }})</div>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endif %}
